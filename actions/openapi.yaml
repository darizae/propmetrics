openapi: 3.1.0
info:
  title: propmetrics-tools
  version: '0.3'
  description: Tool-only API for computing aggregates over NRW Bodenrichtwerte Parquet.
    Return numbers; no prose.
paths:
  /aggregate:
    post:
      tags:
      - analytics
      summary: Compute aggregates
      description: "Count zones and median land value (\u20AC/m\xB2) with optional\
        \ grouping by month, municipality, or land_use."
      operationId: aggregate_aggregate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuerySpec'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AggregateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /download:
    post:
      tags:
      - analytics
      summary: Download aggregate as CSV
      description: Identical result set as /aggregate returned as CSV.
      operationId: download_download_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuerySpec'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AggregateResponse:
      properties:
        filters_echo:
          type: object
          title: Filters Echo
        row_count:
          type: integer
          title: Row Count
        data:
          items:
            $ref: '#/components/schemas/AggregateRow'
          type: array
          title: Data
      type: object
      required:
      - filters_echo
      - row_count
      - data
      title: AggregateResponse
    AggregateRow:
      properties:
        month:
          anyOf:
          - type: string
          - type: 'null'
          title: Month
        municipality:
          anyOf:
          - type: string
          - type: 'null'
          title: Municipality
        land_use:
          anyOf:
          - type: string
          - type: 'null'
          title: Land Use
        zones:
          type: integer
          title: Zones
        median_eur_per_m2:
          anyOf:
          - type: number
          - type: 'null'
          title: Median Eur Per M2
      type: object
      required:
      - zones
      title: AggregateRow
    DateRange:
      properties:
        start:
          type: string
          format: date
          title: Start
        end:
          type: string
          format: date
          title: End
      type: object
      required:
      - start
      - end
      title: DateRange
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    QuerySpec:
      properties:
        date_range:
          $ref: '#/components/schemas/DateRange'
        municipality:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Municipality
        land_use:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Land Use
        plz:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Plz
        groupby:
          type: string
          enum:
          - none
          - month
          - municipality
          - land_use
          title: Groupby
          default: none
      type: object
      required:
      - date_range
      title: QuerySpec
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
tags:
- name: analytics
  description: Aggregates over NRW Bodenrichtwerte Parquet
- name: ops
  description: Operational endpoints
servers:
- url: http://127.0.0.1:8000
